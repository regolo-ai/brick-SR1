[project]
name = "brick-workspace"
version = "2.0.0"
description = "Brick monorepo Python workspace (training, evals, datasets)"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Apache-2.0" }

[tool.uv.workspace]
members = [
    "packages/training",
    "packages/evals",
    "packages/datasets",
]

[dependency-groups]
dev = [
    "brick-evals",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
]

baselines = [
    "routellm",
    "sentence-transformers",
]

[tool.uv.sources]
brick-evals = { workspace = true }
routellm = { git = "https://github.com/lm-sys/RouteLLM", rev = "0b64fdafe049e596a3f5657c219329f24af24198" }

[tool.ruff]
extend-exclude = ["packages/evals/vendor", "packages/evals/external"]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "B008",  # function-call-in-default-argument (common in argparse)
]

[tool.pytest.ini_options]
addopts = "-m 'not generated_data'"
markers = ["generated_data: checks requiring externally generated datasets and quality reports"]
testpaths = ["packages/evals/tests", "packages/training/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
