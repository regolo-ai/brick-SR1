name: npm publish (@regolo-ai/brick)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. 2.0.0, 2.0.1-rc.1)"
        required: true

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # for npm provenance (Sigstore)
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # Install from the repo-root lockfile (npm workspaces). apps/cli has no
      # standalone lockfile; the root package-lock.json already pins the CLI
      # workspace, so a single `npm ci` at the root is reproducible and covers
      # apps/cli via the workspace graph.
      - name: npm ci
        run: npm ci

      - name: Build
        run: npm run build:cli

      - name: Verify package contents
        working-directory: apps/cli
        run: npm pack --dry-run

      - name: Publish
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
