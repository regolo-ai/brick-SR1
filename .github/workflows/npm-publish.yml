name: npm publish verified bundles
on:
  workflow_dispatch:
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require main
        run: |
          test "$GITHUB_REF" = refs/heads/main
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-npm'
          path: release
          merge-multiple: true
      - name: Require every advertised runtime to have passed execution
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            test -f "release/regoloai-brick-runtime-${target}-${version}.tgz" || {
              echo "Missing verified $target artifact; publication is blocked."
              exit 1
            }
          done
      - name: Publish verified runtime packages, then CLI
        run: |
          for bundle in release/*-runtime-*.tgz; do
            npm publish "$bundle" --access public --provenance
          done
          version=$(node -p "require('./apps/cli/package.json').version")
          npm publish "release/regoloai-brick-${version}.tgz" --access public --provenance
