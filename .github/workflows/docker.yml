name: Docker Build & Push (Docker Hub + Regolo)

on:
  push:
    branches: [main, brick2, deploy]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Override tag (e.g. dev, rc1)"
        required: false
        default: ""

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: build & push brick image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload Trivy SARIF to the Security tab
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Compute tags ---

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            docker.io/regolo/brick
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      # --- Build & push ---

      # --- Build locally, scan, then push (Trivy gate before publish) ---

      - name: Build image (load locally for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/router/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=brick-router
          cache-to: type=gha,scope=brick-router,mode=max

      - name: Trivy scan (gate on fixable CRITICAL, table for log visibility)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: v0.72.0
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          timeout: 15m

      - name: Trivy SARIF (report, non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: v0.72.0
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-router.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          timeout: 15m

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-router.sarif
          category: brick-router

      # The production Deployment in regolo-ai/infra consumes this private
      # registry reference with imagePullPolicy: Always. Keep this push scoped
      # to the deploy branch, which is the release branch for the Regolo stack.
      - name: Log in to Regolo registry
        if: github.ref == 'refs/heads/deploy'
        uses: docker/login-action@v3
        with:
          registry: registry.regolo.ai
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image to Regolo registry
        if: github.ref == 'refs/heads/deploy'
        env:
          SOURCE_IMAGE: docker.io/regolo/brick:deploy
          REGOLO_IMAGE: registry.regolo.ai/regolo/brick
          IMAGE_SHA: ${{ github.sha }}
        run: |
          docker tag "$SOURCE_IMAGE" "$REGOLO_IMAGE:latest"
          docker tag "$SOURCE_IMAGE" "$REGOLO_IMAGE:$IMAGE_SHA"
          docker push "$REGOLO_IMAGE:latest"
          docker push "$REGOLO_IMAGE:$IMAGE_SHA"

      # Docker Hub is the public mirror. Publish it only after the production
      # registry push so a Hub credential outage cannot block the Regolo release.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "$TAGS" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Pushing $tag"
            docker push "$tag"
          done
