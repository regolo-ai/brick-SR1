name: Build & Push brick-complexity-server

on:
  workflow_dispatch:
  push:
    branches: ["deploy", "main"]
    paths:
      - "deploy/addons/brick-complexity-server/**"
      - ".github/workflows/brick-complexity-server.yml"
  pull_request:
    paths:
      - "deploy/addons/brick-complexity-server/**"
      - ".github/workflows/brick-complexity-server.yml"

concurrency:
  group: brick-complexity-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: regolo/brick-complexity-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (load locally for scan)
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/addons/brick-complexity-server
          file: ./deploy/addons/brick-complexity-server/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=brick-complexity
          cache-to: type=gha,mode=max,scope=brick-complexity

      - name: Trivy scan (gate on fixable CRITICAL, table for log visibility)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: v0.72.0
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          timeout: 15m

      - name: Trivy SARIF (report, non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: v0.72.0
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-complexity.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          timeout: 15m

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-complexity.sarif
          category: brick-complexity-server

      - name: Push image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "$TAGS" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Pushing $tag"
            docker push "$tag"
          done

      - name: Build summary
        if: always()
        run: |
          echo "### brick-complexity-server build" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags**: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: linux/amd64" >> $GITHUB_STEP_SUMMARY
