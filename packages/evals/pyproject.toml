[project]
name = "brick-evals"
version = "2.0.0"
description = "Brick — Dataset A evaluation pipeline, graders, 3-judge panel, RouteLLM/FrugalGPT/Cascade baselines"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
readme = "README.md"

dependencies = [
    "tqdm>=4.66",
    "absl-py>=2.1",
    "langdetect>=1.0.9",
    "nltk>=3.9",
    "immutabledict>=4.2",
    "emoji>=2.14",
    "syllapy>=0.7",
    "datasketch>=1.6",
    "requests>=2.32",
    "sympy>=1.13",
    "antlr4-python3-runtime==4.11.1",
    "datasets>=2.21",
    "huggingface-hub>=0.25",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "transformers>=4.45",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brick_evals"]
