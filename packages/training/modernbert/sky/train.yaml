# External-capacity provisioning only. Use the scheduler for an existing GPU pool.
# Run from the repository root; provide uv and credentials through the machine environment.
name: modernbert-capability
resources:
  cloud: seeweb
  accelerators: L40S:1
  cpus: 16+
  memory: 64+
workdir: .
setup: |
  set -eu
  command -v uv
  uv sync --frozen --package brick-training
run: |
  set -eu
  uv run --frozen --package brick-training python packages/training/modernbert/scripts/train_modernbert.py --smoke --model_size base --no_wandb
