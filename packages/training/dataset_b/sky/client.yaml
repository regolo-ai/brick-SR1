# External-capacity client. Run from the repository root against an existing API.
name: dataset-b-client
resources:
  cloud: seeweb
  cpus: 2+
workdir: .
envs:
  GENERATION_ENDPOINT: http://localhost:30000/v1/chat/completions
setup: |
  set -eu
  command -v uv
  uv sync --frozen --package brick-training
run: |
  set -eu
  cd packages/training/dataset_b
  uv run --frozen --package brick-training python scripts/01_generate_queries.py --endpoint "$GENERATION_ENDPOINT" --max 100
