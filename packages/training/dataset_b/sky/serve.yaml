# External-capacity provisioning only. The operator supplies an image containing
# SGLang and its locked GPU dependencies; Brick does not install or upgrade them.
name: dataset-b-serve
resources:
  cloud: seeweb
  accelerators: L40S:4
workdir: .
envs:
  MODEL_REPO: Qwen/Qwen3.6-35B-A3B
setup: |
  set -eu
  python -c 'import sglang; print(sglang.__version__)'
run: |
  set -eu
  exec python -m sglang.launch_server --model-path "$MODEL_REPO" --tp 4 --port 30000 --host 127.0.0.1
