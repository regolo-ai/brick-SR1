# Regolo production deployment. From this directory run:
#   BRICK_TAG=<version> docker compose -f docker-compose.regolo.yml up -d
#
# Pin BRICK_TAG in the server environment for a reproducible rollout.
services:
  brick:
    image: docker.io/regolo/brick:${BRICK_TAG:?set BRICK_TAG to the tested image version}
    ports:
      - "${BRICK_HOST_PORT:-8000}:8000"
    volumes:
      - ./config.regolo.yaml:/app/config/config.yaml:ro
      - brick-regolo-model-cache:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  brick-regolo-model-cache:
