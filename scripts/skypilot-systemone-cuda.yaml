name: systemone-cuda-parity

resources:
  accelerators: {L4: 1, A10G: 1}
  disk_size: 200

envs:
  BRICK_SYSTEMONE_ATTENTION: auto

setup: |
  set -euo pipefail
  apt-get update && apt-get install -y python3 python3-venv python3-pip git
  python3 -m venv .venv
  . .venv/bin/activate
  pip install --upgrade pip
  driver=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader | cut -d. -f1)
  capability=$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | head -1 | cut -d. -f1)
  if [ "$capability" -ge 12 ] && [ "$driver" -lt 580 ]; then echo "Blackwell GPU needs driver 580+" >&2; exit 1; fi
  if [ "$driver" -ge 580 ]; then torch_index="https://download.pytorch.org/whl/cu130"
  elif [ "$driver" -ge 560 ]; then torch_index="https://download.pytorch.org/whl/cu126"
  else echo "driver $driver cannot load a pinned CUDA wheel" >&2; exit 1
  fi
  pip install --index-url "$torch_index" torch==2.13.0
  pip install transformers==5.16.1 safetensors==0.8.0 tokenizers==0.23.1 numpy==1.26.4 huggingface-hub==1.29.0
  python - <<'PY'
  from huggingface_hub import snapshot_download
  snapshot_download(
      "regolo/brick-sysone-V1",
      revision="9263a397a366ee22921214ddeebab1f5e4e8facd",
      local_dir="models/systemone",
      allow_patterns=["config.json", "model.safetensors", "tokenizer.json", "tokenizer_config.json"],
  )
  PY

run: |
  set -euo pipefail
  . .venv/bin/activate
  python -c "import torch; assert torch.cuda.is_available(), 'no CUDA device'; print('cuda', torch.cuda.get_device_name(0))"
  python test_systemone_cuda.py --model-dir models/systemone
