server_port: 8000
auto_model_name: brick-v1-beta
trusted_proxy_header: X-Regolo-User-Key
brick:
  enabled: true
providers:
  regolo:
    base_url: https://api.regolo.ai/v1
provider_profiles:
  regolo:
    type: openai_compatible
    base_url: https://api.regolo.ai/v1
provider_endpoints:
- name: regolo
  provider_profile: regolo
  weight: 1
default_model: qwen3.5-122b
model_config:
  qwen3.5-9b:
    preferred_endpoints:
    - regolo
    use_client_key: true
  qwen3.5-122b:
    preferred_endpoints:
    - regolo
    reasoning_family: qwen3
    use_client_key: true
  glm5.2:
    preferred_endpoints:
    - regolo
    use_client_key: true
reasoning_families:
  qwen3:
    parameter: enable_thinking
default_reasoning_effort: medium
complexity_service:
  enabled: true
  base_url: https://api.regolo.ai
  protocol: openai
  model_name: brick-complexity-pro
  use_client_key: true
  timeout_seconds: 8
skill_router:
  enabled: true
  capabilities:
  - coding
  - creative_synthesis
  - instruction_following
  - math_reasoning
  - planning_agentic
  - world_knowledge
  capability_model:
    model_id: models/modernbert-capability-classifier
    labels: [instruction_following, coding, math_reasoning, world_knowledge, planning_agentic, creative_synthesis]
  complexity_model:
    model_id: regolo/brick-complexity-pro
    base_url: https://api.regolo.ai
    protocol: openai
    model_name: brick-complexity-pro
    use_client_key: true
    timeout_seconds: 8
  math:
    tau:
      easy: 0.55
      medium: 0.72
      hard: 0.88
    complexity_mu: 0.34517
    complexity_bias: 0.822235
    cost_penalty_beta: 0.230778
    over_penalty_lambda: 0.045207
    preference_power: 2.920351
    max_mu_multiplier: 13.034935
    max_bias_shift: 5.294173
    max_cost_relief: 6559.073066
    max_over_relief: 49.54794
    min_mu_multiplier: 0.081493
    min_bias_shift: -1.349259
    min_cost_boost: 8.834043
    min_over_boost: 1002.068256
    tie_epsilon: 0.03
    clip_min: 0.02
    clip_max: 0.98
  models:
  - model: qwen3.5-9b
    skill_vector:
    - 0.714788
    - 0.511538
    - 0.810109
    - 0.912146
    - 0.577072
    - 0.179876
    use_reasoning: false
    cost_weight: 0.1
  - model: qwen3.5-122b
    skill_vector:
    - 0.62
    - 0.48
    - 0.7
    - 0.58
    - 0.66
    - 0.78
    use_reasoning: true
    reasoning_effort: medium
    cost_weight: 1
  - model: glm5.2
    skill_vector:
    - 0.78
    - 0.72
    - 0.68
    - 0.89
    - 0.73
    - 0.83
    use_reasoning: true
    reasoning_effort: medium
    cost_weight: 2
  keyword_rules:
  - name: force_coder
    mode: override
    importance: 10
    model: glm5.2
    operator: OR
    keywords:
    - debug
    - refactor
    - compile
    - runtime
    - write a function
    - function that
    - class called
    case_sensitive: false
  - name: coding_bias
    mode: bias
    importance: 8
    capability: coding
    operator: OR
    keywords:
    - python
    - javascript
    - typescript
    - golang
    - rust
    - java
    - sql
    - bash
    - async
    - thread
    case_sensitive: false
config_version: 1
