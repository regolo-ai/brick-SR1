[package]
name = "candle-spatial-router"
version = "0.4.0"
edition = "2021"
description = "Brick CPU ModernBERT capability inference"
license = "MIT OR Apache-2.0"

[lib]
name = "candle_spatial_router"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
candle-core = { git = "https://github.com/huggingface/candle", tag = "0.9.2-alpha.1" }
candle-nn = { git = "https://github.com/huggingface/candle", tag = "0.9.2-alpha.1" }
tokenizers = { version = "0.21.0", default-features = false, features = ["onig"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.93"
