# SystemOne routing: local sigmoid vectors, a linear knob, and Euclidean distance.
# The CLI supplies the verified checkpoint directory via --model-dir.
providers:
  regoloai:
    base_url: https://api.regolo.ai/v1
brick:
  enabled: true
  stt_model: faster-whisper-large-v3
  stt_endpoint: https://api.regolo.ai/v1/audio/transcriptions
  ocr_model: deepseek-ocr-2
  ocr_endpoint: https://api.regolo.ai/v1/chat/completions
  vision_model: qwen3.5-122b
  vision_endpoint: https://api.regolo.ai/v1/chat/completions
  ocr_min_text_length: 10
server_port: 8000
auto_model_name: brick
provider_profiles:
  regolo:
    type: openai_compatible
    base_url: https://api.regolo.ai/v1
provider_endpoints:
- name: regolo
  provider_profile: regolo
  weight: 1
default_model: qwen3.5-122b
model_config:
  qwen3.5-9b:
    preferred_endpoints:
    - regolo
    use_client_key: true
  deepseek-v4-flash:
    preferred_endpoints:
    - regolo
    use_client_key: true
  kimi2.6:
    preferred_endpoints:
    - regolo
    reasoning_family: qwen3
    use_client_key: true
  qwen3-coder-next:
    preferred_endpoints:
    - regolo
    use_client_key: true
  qwen3.5-122b:
    preferred_endpoints:
    - regolo
    reasoning_family: qwen3
    use_client_key: true
  minimax-m2.5:
    preferred_endpoints:
    - regolo
    reasoning_family: minimax
    use_client_key: true
reasoning_families:
  qwen3:
    parameter: enable_thinking
  minimax:
    parameter: reasoning_effort
anthropic_passthrough:
  enabled: true
  upstream_url: https://api.anthropic.com
  extra_usage_enabled: false
  context_1m_threshold_bytes: 600000
skill_router:
  enabled: true
  capabilities:
  - instruction_following
  - coding
  - math_reasoning
  - world_knowledge
  - planning_agentic
  - creative_synthesis
  models:
  - model: qwen3.5-9b
    skill_vector:
    - 0.810109
    - 0.714788
    - 0.912146
    - 0.179876
    - 0.577072
    - 0.511538
    use_reasoning: false
  - model: deepseek-v4-flash
    skill_vector:
    - 0.863112
    - 0.820939
    - 0.934963
    - 0.488518
    - 0.62055
    - 0.657845
    use_reasoning: false
  - model: kimi2.6
    skill_vector:
    - 0.87018
    - 0.904272
    - 0.943892
    - 0.344074
    - 0.641863
    - 0.751595
    use_reasoning: true
  systemone:
    local_path: models/systemone
  knob: 0
config_version: 2
