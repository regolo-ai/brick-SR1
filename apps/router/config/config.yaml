providers:
  regoloai:
    base_url: https://api.regolo.ai/v1
brick:
  enabled: true
  stt_model: faster-whisper-large-v3
  stt_endpoint: https://api.regolo.ai/v1/audio/transcriptions
  ocr_model: deepseek-ocr-2
  ocr_endpoint: https://api.regolo.ai/v1/chat/completions
  vision_model: qwen3.5-122b
  vision_endpoint: https://api.regolo.ai/v1/chat/completions
  ocr_min_text_length: 10
server_port: 8000
auto_model_name: brick
provider_profiles:
  regolo:
    type: openai_compatible
    base_url: https://api.regolo.ai/v1
provider_endpoints:
- name: regolo
  provider_profile: regolo
  weight: 1
default_model: qwen3.5-122b
model_config:
  qwen3.5-9b:
    preferred_endpoints:
    - regolo
    use_client_key: true
  deepseek-v4-flash:
    preferred_endpoints:
    - regolo
    use_client_key: true
  kimi2.6:
    preferred_endpoints:
    - regolo
    reasoning_family: qwen3
    use_client_key: true
  qwen3-coder-next:
    preferred_endpoints:
    - regolo
    use_client_key: true
  qwen3.5-122b:
    preferred_endpoints:
    - regolo
    reasoning_family: qwen3
    use_client_key: true
  minimax-m2.5:
    preferred_endpoints:
    - regolo
    reasoning_family: minimax
    use_client_key: true
reasoning_families:
  qwen3:
    parameter: enable_thinking
  minimax:
    parameter: reasoning_effort
default_reasoning_effort: medium
complexity_service:
  enabled: true
  base_url: https://api.regolo.ai
  protocol: openai
  model_name: brick-complexity-pro
  bearer_token: ${REGOLO_API_KEY}
  timeout_seconds: 8
  use_client_key: true
anthropic_passthrough:
  enabled: true
  upstream_url: https://api.anthropic.com
  extra_usage_enabled: false
  context_1m_threshold_bytes: 600000
  model_map:
    easy: claude-haiku-4-5
    medium: claude-sonnet-4-6
    hard: claude-opus-4-7
  model_map_1m:
    easy: claude-sonnet-4-6
    medium: claude-sonnet-4-6
    hard: claude-opus-4-7
skill_router:
  enabled: true
  capabilities:
  - coding
  - creative_synthesis
  - instruction_following
  - math_reasoning
  - planning_agentic
  - world_knowledge
  capability_model:
    model_id: models/modernbert-capability-classifier
    labels:
    - coding
    - creative_synthesis
    - instruction_following
    - math_reasoning
    - planning_agentic
    - world_knowledge
  complexity_model:
    model_id: regolo/brick-complexity-pro
    base_url: https://api.regolo.ai
    protocol: openai
    model_name: brick-complexity-pro
    bearer_token: ${REGOLO_API_KEY}
    timeout_seconds: 8
    use_client_key: true
  math:
    tau:
      easy: 0.55
      medium: 0.72
      hard: 0.88
    over_penalty_lambda: 0.05
    tie_epsilon: 0.03
    clip_min: 0.02
    clip_max: 0.98
  models:
  - model: qwen3.5-9b
    skill_vector:
    - 0.714788
    - 0.511538
    - 0.810109
    - 0.912146
    - 0.577072
    - 0.179876
    use_reasoning: false
    cost_weight: 0.1
  - model: deepseek-v4-flash
    skill_vector:
    - 0.820939
    - 0.657845
    - 0.863112
    - 0.934963
    - 0.62055
    - 0.488518
    use_reasoning: false
    cost_weight: 0.4
  - model: kimi2.6
    skill_vector:
    - 0.904272
    - 0.751595
    - 0.87018
    - 0.943892
    - 0.641863
    - 0.344074
    use_reasoning: true
    reasoning_effort: medium
    cost_weight: 0.6
  keyword_rules:
  - name: force_coder
    mode: override
    importance: 10
    model: kimi2.6
    operator: OR
    keywords:
    - debug
    - refactor
    - compile
    - runtime
    - write a function
    - function that
    - class called
    case_sensitive: false
  - name: coding_bias
    mode: bias
    importance: 8
    capability: coding
    operator: OR
    keywords:
    - python
    - javascript
    - typescript
    - golang
    - rust
    - java
    - sql
    - bash
    - async
    - thread
    case_sensitive: false
config_version: 1
