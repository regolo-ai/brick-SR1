# SystemOne routing: local sigmoid vectors, a linear knob, and Euclidean distance.
# The CLI supplies the verified checkpoint directory via --model-dir.
# OpenCode talks to this router through the managed `provider.brick` block in
# ~/.config/opencode/opencode.json; Brick picks the upstream model.
config_version: 2
server_port: 8000
auto_model_name: brick
include_config_models_in_list: true
brick:
  enabled: true
  use_model_routing: true
providers:
  regolo:
    base_url: https://api.regolo.ai/v1
  openai:
    base_url: https://api.openai.com/v1
  openai-codex:
    base_url: https://chatgpt.com/backend-api/codex
  claude-api:
    base_url: https://api.anthropic.com
  claude-code:
    base_url: https://api.anthropic.com
  openrouter:
    base_url: https://openrouter.ai/api/v1
provider_profiles:
  regolo:
    type: openai_compatible
    base_url: https://api.regolo.ai/v1
  openai:
    type: openai_compatible
    base_url: https://api.openai.com/v1
  openai-codex:
    type: openai_compatible
    base_url: https://chatgpt.com/backend-api/codex
  claude-api:
    type: openai_compatible
    base_url: https://api.anthropic.com
  claude-code:
    type: openai_compatible
    base_url: https://api.anthropic.com
  openrouter:
    type: openai_compatible
    base_url: https://openrouter.ai/api/v1
provider_endpoints:
- name: regolo
  provider_profile: regolo
  weight: 1
- name: openai
  provider_profile: openai
  weight: 1
- name: openai-codex
  provider_profile: openai-codex
  weight: 1
- name: claude-api
  provider_profile: claude-api
  weight: 1
- name: claude-code
  provider_profile: claude-code
  weight: 1
- name: openrouter
  provider_profile: openrouter
  weight: 1
default_model: gpt-6.1-terra
model_config:
  gpt-6-luna:
    preferred_endpoints:
    - openai
    reasoning_family: openai_reasoning
    context_window_size: 258400
    allowed_thinking_modes:
    - low
    - medium
    - high
    - xhigh
    - max
  gpt-6.1-terra:
    preferred_endpoints:
    - openai
    reasoning_family: openai_reasoning
    context_window_size: 475000
    allowed_thinking_modes:
    - low
    - medium
    - high
    - xhigh
    - max
reasoning_families:
  openai_reasoning:
    parameter: reasoning_effort
skill_router:
  enabled: true
  capabilities:
  - instruction_following
  - coding
  - math_reasoning
  - world_knowledge
  - planning_agentic
  - creative_synthesis
  models:
  - model: gpt-6-luna
    skill_vector:
    - 0.5
    - 0.51
    - 0.84
    - 0.63
    - 0.54
    - 0.59
    use_reasoning: true
  - model: gpt-6.1-terra
    skill_vector:
    - 0.5
    - 0.5
    - 0.49
    - 0.39
    - 0.38
    - 0.41
    use_reasoning: true
  active_models:
  - gpt-6-luna
  - gpt-6.1-terra
  systemone:
    local_path: models/systemone
  knob: 0
