# SystemOne routing: local sigmoid vectors, a linear knob, and Euclidean distance.
# The CLI supplies the verified checkpoint directory via --model-dir.
config_version: 2
server_port: 8000
auto_model_name: brick-claude
providers:
  regolo:
    base_url: https://api.regolo.ai/v1
  openai:
    base_url: https://api.openai.com/v1
  openai-codex:
    base_url: https://chatgpt.com/backend-api/codex
  claude-api:
    base_url: https://api.anthropic.com
  claude-code:
    base_url: https://api.anthropic.com
  openrouter:
    base_url: https://openrouter.ai/api/v1
provider_profiles:
  regolo:
    type: openai_compatible
    base_url: https://api.regolo.ai/v1
  openai:
    type: openai_compatible
    base_url: https://api.openai.com/v1
  openai-codex:
    type: openai_compatible
    base_url: https://chatgpt.com/backend-api/codex
  claude-api:
    type: openai_compatible
    base_url: https://api.anthropic.com
  claude-code:
    type: openai_compatible
    base_url: https://api.anthropic.com
  openrouter:
    type: openai_compatible
    base_url: https://openrouter.ai/api/v1
provider_endpoints:
- name: regolo
  provider_profile: regolo
  weight: 1
- name: openai
  provider_profile: openai
  weight: 1
- name: openai-codex
  provider_profile: openai-codex
  weight: 1
- name: claude-api
  provider_profile: claude-api
  weight: 1
- name: claude-code
  provider_profile: claude-code
  weight: 1
- name: openrouter
  provider_profile: openrouter
  weight: 1
default_model: claude-sonnet-4-6
model_config:
  claude-haiku-4-5:
    preferred_endpoints:
    - regolo
    param_size: 1b
  claude-sonnet-4-6:
    preferred_endpoints:
    - regolo
    param_size: 1b
  claude-sonnet-5:
    preferred_endpoints:
    - regolo
    param_size: unknown
  claude-opus-4-8:
    preferred_endpoints:
    - regolo
    param_size: 1b
  claude-fable-5:
    preferred_endpoints:
    - regolo
    param_size: unknown
skill_router:
  enabled: true
  capabilities:
  - instruction_following
  - coding
  - math_reasoning
  - world_knowledge
  - planning_agentic
  - creative_synthesis
  models: []
  active_models: []
  systemone:
    local_path: models/systemone
  knob: 0
anthropic_passthrough:
  enabled: true
  context_window:
    enabled: true
    k: 8
  route_subagents: false
  upstream_url: https://api.anthropic.com
  extra_usage_enabled: false
  context_1m_threshold_bytes: 600000
decisions: []
