# SystemOne routing: local sigmoid vectors, a linear knob, and Euclidean distance.
# The CLI supplies the verified checkpoint directory via --model-dir.
config_version: 2
codex_router:
  enabled: true
  local_key_env: BRICK_CODEX_LOCAL_KEY
server_port: 8000
auto_model_name: brick
include_config_models_in_list: true
brick:
  enabled: true
  use_model_routing: true
  context_window:
    enabled: true
    k: 8
  ocr_min_text_length: 10
providers:
  openai-codex:
    base_url: https://chatgpt.com/backend-api/codex
provider_profiles:
  openai-codex:
    type: openai_compatible
    base_url: https://chatgpt.com/backend-api/codex
    protocol: responses
    auth_source: codex_request
    responses_path: responses
    capabilities:
    - function_tools
    - custom_tools
    - opaque_reasoning
    - images
    - audio
    - files
    - compaction
    - item:tool_search
    - item:web_search
    - item:additional_tools
    - item:namespace
provider_endpoints:
- name: openai-codex
  provider_profile: openai-codex
  weight: 1
default_model: gpt-6.1-terra
model_config:
  gpt-6-luna:
    preferred_endpoints:
    - openai-codex
    reasoning_family: openai_reasoning
    context_window_size: 258400
    allowed_thinking_modes:
    - low
    - medium
    - high
    - xhigh
    - max
  gpt-6.1-terra:
    preferred_endpoints:
    - openai-codex
    reasoning_family: openai_reasoning
    context_window_size: 475000
    allowed_thinking_modes:
    - low
    - medium
    - high
    - xhigh
    - max
reasoning_families:
  openai_reasoning:
    parameter: reasoning_effort
skill_router:
  enabled: true
  capabilities:
  - instruction_following
  - coding
  - math_reasoning
  - world_knowledge
  - planning_agentic
  - creative_synthesis
  models:
  - model: gpt-6-luna
    skill_vector:
    - 0.5
    - 0.51
    - 0.84
    - 0.63
    - 0.54
    - 0.59
    use_reasoning: true
  - model: gpt-6.1-terra
    skill_vector:
    - 0.5
    - 0.5
    - 0.49
    - 0.39
    - 0.38
    - 0.41
    use_reasoning: true
  active_models:
  - gpt-6-luna
  - gpt-6.1-terra
  keywords:
  - name: strong-agentic
    model: gpt-6.1-terra
    keywords:
    - apply_patch
    - refactor
    - debug
    - bug
    - bugs
    - failing test
    - failing tests
    - unit test
    - unit tests
  systemone:
    local_path: models/systemone
  knob: 0
