config_version: 1
# Default Brick profile for OpenAI Codex — materialized automatically by `brick start codex`.
# Brick router profile. Codex talks to the
# router over /v1/responses (wire_api = "responses") with model = "brick"; the
# skill router selects compatible provider transports. The original Codex
# session owns authentication and tools; external keys stay in the profile .env.


codex_router:
  enabled: true
  local_key_env: BRICK_CODEX_LOCAL_KEY

server_port: 8000
auto_model_name: brick
include_config_models_in_list: true

brick:
  enabled: true
  use_model_routing: true
  context_window:
    enabled: true
    k: 8
  # Cache-aware routing; smartsqueeze is the safe default for Codex profiles.
  routing_mode: smartsqueeze
  ocr_min_text_length: 10

providers:
  regolo:
    base_url: https://api.regolo.ai/v1
  openai-codex:
    base_url: https://chatgpt.com/backend-api/codex
provider_profiles:
  regolo:
    type: openai_compatible
    base_url: https://api.regolo.ai/v1
    protocol: chat_completions
    auth_source: provider_env
    api_key_env: REGOLO_API_KEY
    capabilities: [function_tools]
  openai-codex:
    type: openai_compatible
    base_url: https://chatgpt.com/backend-api/codex
    protocol: responses
    auth_source: codex_request
    responses_path: responses
    capabilities: [function_tools, custom_tools, opaque_reasoning, images, audio, files, compaction, 'item:tool_search', 'item:web_search', 'item:additional_tools', 'item:namespace']
provider_endpoints:
  - name: regolo
    provider_profile: regolo
    weight: 1
  - name: openai-codex
    provider_profile: openai-codex
    weight: 1
default_model: qwen3.5-122b
model_config:
  qwen3.5-122b: { preferred_endpoints: ["regolo"], param_size: "122b", reasoning_family: qwen3 }
  gpt-5.6-terra: { preferred_endpoints: ["openai-codex"], param_size: "unknown", reasoning_family: openai_reasoning }

reasoning_families:
  qwen3: { type: chat_template_kwargs, parameter: enable_thinking }
  openai_reasoning: { type: reasoning_effort, parameter: reasoning_effort }
default_reasoning_effort: medium

# Complexity classifier: hosted on Regolo's OpenAI-compatible API by default
# (model brick-complexity-pro). No local GPU/sidecar needed; the router expands
complexity_service:
  enabled: true
  base_url: https://api.regolo.ai
  protocol: openai
  model_name: brick-complexity-pro
  bearer_token: "${REGOLO_API_KEY}"
  timeout_seconds: 8

# Full skill router over the mixed provider pool. dynamic_effort derives the per-query
# reasoning_effort from complexity, clamped by routing_preference (eco..max).
skill_router:
  enabled: true
  dynamic_effort: true
  capabilities: [coding, creative_synthesis, instruction_following, math_reasoning, planning_agentic, world_knowledge]
  capability_model:
    model_id: models/modernbert-capability-classifier
    labels: [instruction_following, coding, math_reasoning, world_knowledge, planning_agentic, creative_synthesis]
  complexity_model:
    model_id: regolo/brick-complexity-pro
    base_url: https://api.regolo.ai
    protocol: openai
    model_name: brick-complexity-pro
    bearer_token: "${REGOLO_API_KEY}"
    timeout_seconds: 8
  math:
    routing_preference: 0
    tau: { easy: 0.55, medium: 0.72, hard: 0.88 }
  models:
    - model: qwen3.5-122b
      skill_vector: [0.50, 0.38, 0.57, 0.48, 0.52, 0.68]
      use_reasoning: true
    - model: gpt-5.6-terra
      skill_vector: [0.85, 0.85, 0.80, 0.88, 0.86, 0.88]
      use_reasoning: true
  active_models: [qwen3.5-122b, gpt-5.6-terra]
  keyword_rules: []

decisions: []
