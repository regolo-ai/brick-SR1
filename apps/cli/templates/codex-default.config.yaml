# SystemOne routing: local sigmoid vectors, a linear knob, and Euclidean distance.
# The CLI supplies the verified checkpoint directory via --model-dir.
config_version: 2
codex_router:
  enabled: true
  local_key_env: BRICK_CODEX_LOCAL_KEY
server_port: 8000
auto_model_name: brick
include_config_models_in_list: true
brick:
  enabled: true
  use_model_routing: true
  context_window:
    enabled: true
    k: 8
  ocr_min_text_length: 10
providers:
  regolo:
    base_url: https://api.regolo.ai/v1
  openai-codex:
    base_url: https://chatgpt.com/backend-api/codex
provider_profiles:
  regolo:
    type: openai_compatible
    base_url: https://api.regolo.ai/v1
    protocol: chat_completions
    auth_source: provider_env
    api_key_env: REGOLO_API_KEY
    capabilities:
    - function_tools
  openai-codex:
    type: openai_compatible
    base_url: https://chatgpt.com/backend-api/codex
    protocol: responses
    auth_source: codex_request
    responses_path: responses
    capabilities:
    - function_tools
    - custom_tools
    - opaque_reasoning
    - images
    - audio
    - files
    - compaction
    - item:tool_search
    - item:web_search
    - item:additional_tools
    - item:namespace
provider_endpoints:
- name: regolo
  provider_profile: regolo
  weight: 1
- name: openai-codex
  provider_profile: openai-codex
  weight: 1
default_model: qwen3.5-122b
model_config:
  qwen3.5-122b:
    preferred_endpoints:
    - regolo
    param_size: 122b
    reasoning_family: qwen3
  gpt-5.6-terra:
    preferred_endpoints:
    - openai-codex
    param_size: unknown
    reasoning_family: openai_reasoning
reasoning_families:
  qwen3:
    parameter: enable_thinking
  openai_reasoning:
    parameter: reasoning_effort
skill_router:
  enabled: true
  capabilities:
  - instruction_following
  - coding
  - math_reasoning
  - world_knowledge
  - planning_agentic
  - creative_synthesis
  models:
  - model: qwen3.5-122b
    skill_vector:
    - 0.57
    - 0.5
    - 0.48
    - 0.68
    - 0.52
    - 0.38
    use_reasoning: true
  - model: gpt-5.6-terra
    skill_vector:
    - 0.8
    - 0.85
    - 0.88
    - 0.88
    - 0.86
    - 0.85
    use_reasoning: true
  active_models:
  - qwen3.5-122b
  - gpt-5.6-terra
  systemone:
    local_path: models/systemone
  knob: 0
decisions: []
