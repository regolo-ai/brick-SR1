# Default Brick profile for OpenAI Codex — materialized automatically by `brick codex on`.
# Two-container stack: complexity classifier + Brick router. Codex talks to the
# router over /v1/responses (wire_api = "responses") with model = "brick"; the
# full skill router selects among the OpenAI pool and forwards each pick to
# api.openai.com using the client's own OpenAI bearer (forwarded verbatim).

model:
  name: brick-codex
  description: Default Brick router for OpenAI Codex (Responses API)

server_port: 8000
auto_model_name: brick
include_config_models_in_list: true

# Model download registry: maps the local model path used by the skill router's
# capability classifier to its Hugging Face repo, so the router downloads ModernBERT
# on first start. Required whenever skill_router.enabled is true.
mom_registry:
  models/modernbert-capability-classifier: "regolo/modernbert-capability-classifier"

brick:
  enabled: true
  use_model_routing: true
  fixed_model: gpt-5.4
  context_window:
    enabled: true
    k: 8
  # Cache-aware routing; smartsqueeze is the safe default for Codex profiles.
  routing_mode: smartsqueeze
  ocr_min_text_length: 10

providers:
  openai:
    type: openai_compatible
    base_url: https://api.openai.com/v1
provider_profiles:
  openai:
    type: openai_compatible
    base_url: https://api.openai.com/v1
provider_endpoints:
  - name: openai
    provider_profile: openai
    weight: 1
default_model: gpt-5.6-terra
model_config:
  gpt-5.6-sol: { preferred_endpoints: ["openai"], param_size: "unknown", reasoning_family: openai_reasoning }
  gpt-5.6-terra: { preferred_endpoints: ["openai"], param_size: "unknown", reasoning_family: openai_reasoning }
  gpt-5.6-luna: { preferred_endpoints: ["openai"], param_size: "unknown", reasoning_family: openai_reasoning }
  gpt-5.5: { preferred_endpoints: ["openai"], param_size: "unknown", reasoning_family: openai_reasoning }
  gpt-5.4: { preferred_endpoints: ["openai"], param_size: "unknown", reasoning_family: openai_reasoning }
  gpt-5.4-mini: { preferred_endpoints: ["openai"], param_size: "unknown", reasoning_family: openai_reasoning }
  o3: { preferred_endpoints: ["openai"], param_size: "unknown", reasoning_family: openai_reasoning }
  o3-mini: { preferred_endpoints: ["openai"], param_size: "unknown", reasoning_family: openai_reasoning }

reasoning_families:
  openai_reasoning: { type: reasoning_effort, parameter: reasoning_effort }
default_reasoning_effort: medium

# Complexity classifier: hosted on Regolo's OpenAI-compatible API by default
# (model brick-complexity-pro). No local GPU/sidecar needed; the router expands
# ${REGOLO_API_KEY} from the profile .env. Switch to a self-hosted local
# classifier any time with: brick codex settings compute local
complexity_service:
  enabled: true
  base_url: https://api.regolo.ai
  protocol: openai
  model_name: brick-complexity-pro
  bearer_token: "${REGOLO_API_KEY}"
  timeout_seconds: 8
  auto_spawn: false

# Full skill router over the OpenAI pool. dynamic_effort derives the per-query
# reasoning_effort from complexity, clamped by routing_preference (eco..max).
skill_router:
  enabled: true
  dynamic_effort: true
  capabilities: [coding, creative_synthesis, instruction_following, math_reasoning, planning_agentic, world_knowledge]
  capability_model:
    model_id: models/modernbert-capability-classifier
    repo_id: regolo/modernbert-capability-classifier
    labels: [coding, creative_synthesis, instruction_following, math_reasoning, planning_agentic, world_knowledge]
    use_cpu: true
  complexity_model:
    model_id: regolo/brick-complexity-pro
    base_model_id: Qwen/Qwen3.5-0.8B
    base_url: https://api.regolo.ai
    protocol: openai
    model_name: brick-complexity-pro
    bearer_token: "${REGOLO_API_KEY}"
    timeout_seconds: 8
    auto_spawn: false
  math:
    routing_preference: 0
    tau: { easy: 0.55, medium: 0.72, hard: 0.88 }
  models:
    - model: gpt-5.6-luna
      skill_vector: [0.80, 0.80, 0.75, 0.82, 0.83, 0.82]
      cost_weight: 0.1
      use_reasoning: true
      base_url: https://api.openai.com/v1
    - model: gpt-5.4-mini
      skill_vector: [0.55, 0.45, 0.66, 0.78, 0.58, 0.74]
      cost_weight: 0.1
      use_reasoning: true
      base_url: https://api.openai.com/v1
    - model: o3-mini
      skill_vector: [0.55, 0.45, 0.60, 0.90, 0.66, 0.80]
      cost_weight: 0.2
      use_reasoning: true
      base_url: https://api.openai.com/v1
    - model: gpt-5.6-terra
      skill_vector: [0.85, 0.85, 0.80, 0.88, 0.86, 0.88]
      cost_weight: 0.4
      use_reasoning: true
      base_url: https://api.openai.com/v1
    - model: gpt-5.4
      skill_vector: [0.80, 0.62, 0.70, 0.89, 0.78, 0.90]
      cost_weight: 0.5
      use_reasoning: true
      base_url: https://api.openai.com/v1
    - model: o3
      skill_vector: [0.74, 0.52, 0.64, 0.96, 0.74, 0.89]
      cost_weight: 0.7
      use_reasoning: true
      base_url: https://api.openai.com/v1
    - model: gpt-5.5
      skill_vector: [0.88, 0.70, 0.74, 0.93, 0.85, 0.93]
      cost_weight: 1.0
      use_reasoning: true
      base_url: https://api.openai.com/v1
    - model: gpt-5.6-sol
      skill_vector: [0.90, 0.91, 0.86, 0.94, 0.92, 0.94]
      cost_weight: 1.0
      use_reasoning: true
      base_url: https://api.openai.com/v1
  keyword_rules: []

decisions: []
